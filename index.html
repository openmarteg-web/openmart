  localStorage.setItem("openmart_orders", JSON.stringify(orders));
}, [orders]);
// مراقبة حالة جلسة المستخدم وحفظها تلقائياً
  useEffect(() => {
    if (window.supabase) {
      // التحقق من الجلسة المخزنة مسبقاً
      window.supabase.auth.getSession().then(({ data: { session } }) => {
        setUser(session ? session.user : null);
      });

      // الاستماع لأي تغيير في حالة تسجيل الدخول أو الخروج
      const { data: { subscription } } = window.supabase.auth.onAuthStateChange((_event, session) => {
        setUser(session ? session.user : null);
      });

      return () => subscription.unsubscribe();
    }
  }, []);

  // 3. دالة التنقل بين الصفحات
  const go = (p, id) => {
    if(id) setProductId(id);
    setPage(p);
    window.history.pushState({ openmart: true, page: p, id: id || null }, "", "");
    window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
  };

  // 4. تسجيل الدخول بجوجل
  const loginWithGoogle = async () => {
    try {
      showToast("جاري التوجيه لحساب Google...");
      await window.signInWithGoogle();
    } catch (err) {
      console.error(err);
      showToast("تعذر تسجيل الدخول، حاول مرة أخرى.");
    }
  };

  // 5. تسجيل الخروج
  const logout = async () => {
    try {
      await window.signOutUser();
      setUser(null);
      showToast("تم تسجيل الخروج بنجاح.");
    } catch (err) {
      console.error(err);
    }
  };

  const requestLogout = () => setShowLogoutConfirm(true);

  // 6. إدارة السلة والإشعارات
  const showToast = (msg) => {
    setToast(activeLanguage === "en" ? (UI_TRANSLATIONS[msg] || msg) : msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(()=>setToast(""), 2400);
  };

// 1. حالة للتحكم في النافذة المنبثقة للمنتجات المشابهة
  const [upsellModal, setUpsellModal] = useState(null);

  // 2. دالة استخراج منتجات من نفس القسم
  const getRelatedProducts = (currentProduct) => {
    return products
      .filter(p => p.id !== currentProduct.id && productCategories(p).some(category => productHasCategory(currentProduct, category)))
      .slice(0, 3);
  };

  // 3. دالة الإضافة مع فتح نافذة الاقتراحات
  const addToCart = (product, variant, qty) => {
    setCart(c=>{
      const existingIdx = c.findIndex(i=>i.product.id===product.id && i.variant.size===variant.size && i.variant.color===variant.color);
      if(existingIdx>-1){
        const copy=[...c]; copy[existingIdx] = {...copy[existingIdx], qty: copy[existingIdx].qty+qty}; return copy;
      }
      return [...c, {product, variant, qty}];
    });
    showToast(`تمت إضافة "${productName(product)}" إلى السلة`);

    // جلب المنتجات المشابهة وإظهار النافذة فوراً
    const related = getRelatedProducts(product);
    if (related && related.length > 0) {
      setUpsellModal({ item: product, suggestions: related });
    }
  };

const quickAdd = (product) => addToCart(product, {color:product.colors[0], size:product.sizes[0]}, 1);
const buyNowDirect = (product, selectedVariant, selectedQty = 1) => {
  const pColor = selectedVariant?.color || ((product.colors && product.colors.length > 0) ? product.colors[0] : "قياسي");
  const pSize = selectedVariant?.size || ((product.sizes && product.sizes.length > 0) ? product.sizes[0] : "موحد");
    
    setCart(c => {
      const existingIdx = c.findIndex(i => 
        String(i.product.id) === String(product.id) && 
        i.variant.size === pSize && 
        i.variant.color === pColor
      );
      if (existingIdx > -1) {
        const copy = [...c];
        copy[existingIdx] = { ...copy[existingIdx], qty: copy[existingIdx].qty + selectedQty };
        return copy;
      }
      return [...c, { product, variant: { color: pColor, size: pSize }, qty: selectedQty }];
    });
    
    showToast(`تمت إضافة "${productName(product)}" وجاري إتمام الطلب...`);
    go("checkout");
  };  const updateQty = (idx, qty) => setCart(c=>c.map((it,i)=>i===idx?{...it,qty}:it));
  const removeItem = (idx) => setCart(c=>c.filter((_,i)=>i!==idx));
  const toggleWish = (id) => setWishlist(w=> w.includes(id) ? w.filter(x=>x!==id) : (showToast("تمت الإضافة إلى قائمة الأمنيات"), [...w,id]));

 const placeOrder = async (customer, coupon = appliedCoupon, shippingCost = 0) => {
    const subtotal = cart.reduce((s, i) => s + i.product.price * i.qty, 0);
   const shipping = Number(shippingCost) || 0;
   const discount = coupon ? Math.min(coupon.discount, subtotal) : 0;
   const totalAmount = Math.max(0, subtotal + shipping - discount);

    showToast("جاري تسجيل الطلب...");

   try {
      let savedDbOrder = null;
      if (window.saveOrderToDatabase) {
        savedDbOrder = await window.saveOrderToDatabase(cart, totalAmount, customer);
      }

      const newOrder = {
        id: savedDbOrder ? savedDbOrder.id : Date.now().toString().slice(-6),
        userId: user?.id || null,
        date: new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
        items: [...cart],
        total: totalAmount,
        customer: customer,
        status: "new"
      };

      setOrders(prev => [newOrder, ...prev]);

      // تجهيز رسالة الواتساب المنسقة
      let msg = "مرحباً، أود إتمام هذا الطلب (دفع عند الاستلام):%0A%0A";
      msg += `👤 *الاسم:* ${customer.name}%0A`;
      msg += `📞 *الموبايل:* ${customer.phone}%0A`;
      msg += `📍 *العنوان:* ${customer.address}%0A`;
      if (customer.notes) {
        msg += `📝 *ملاحظات:* ${customer.notes}%0A`;
      }
      msg += `%0A🛒 *تفاصيل المنتجات:*%0A`;
      cart.forEach((item, idx) => {
        msg += `${idx + 1}. ${productName(item.product)}%0A`;
        msg += `   - الكمية: ${item.qty}%0A`;
        if (item.variant && item.variant.color) msg += `   - اللون: ${item.variant.color}%0A`;
        if (item.variant && item.variant.size) msg += `   - المقاس: ${item.variant.size}%0A`;
        msg += `   - السعر: ${item.product.price * item.qty} ج.م%0A`;
      });
      msg += `%0A💰 *الإجمالي النهائي:* ${totalAmount} ج.م`;

      // تفريغ السلة وتوجيه العميل مباشرة للرقم المطلوب
      setCart([]);
      window.open(`https://wa.me/201041397168?text=${msg}`, '_blank');
      go("orders");
    } catch (error) {
      console.error(error);
      showToast("حدث خطأ أثناء تسجيل الطلب، يرجى المحاولة ثانية.");
    }
  };
  const cartCount = cart.reduce((s,i)=>s+i.qty,0);

  
  return (
    <>
      {/* تعديل خاصية login لتوجهنا لصفحة auth */}
      <Header 
  page={page} 
  go={go} 
  cartCount={cartCount} 
  wishCount={wishlist.length} 
  onOpenMenu={()=>setMenuOpen(true)} 
  search={search} 
  setSearch={setSearch} 
  user={user} 
  login={() => go("auth")} 
  requestLogout={requestLogout} 
  topbarText={topbarText}
  lang={lang}
  setLang={setLang}
/>      
      
      <MobileDrawer
        open={menuOpen}
        onClose={()=>setMenuOpen(false)}
        go={go}
        search={search}
        setSearch={setSearch}
        login={()=>go("auth")}
        wishlist={wishlist}
      />

      {/* إضافة صفحة تسجيل الدخول هنا */}
      {page==="auth" && <AuthPage user={user} isSignUpMode={isSignUpMode} setIsSignUpMode={setIsSignUpMode} emailInput={emailInput} setEmailInput={setEmailInput} passInput={passInput} setPassInput={setPassInput} handleEmailAuth={handleEmailAuth} go={go}/>}

{page==="home" && <HomePage go={go} wishlist={wishlist} toggleWish={toggleWish} quickAdd={quickAdd} onBuyNow={buyNowDirect} setCatFilter={setCatFilter} products={products} categories={categories}/>}
{page==="shop" && <ShopPage go={go} wishlist={wishlist} toggleWish={toggleWish} quickAdd={quickAdd} onBuyNow={buyNowDirect} catFilter={catFilter} setCatFilter={setCatFilter} search={search} products={products} categories={categories}/>}

{page==="product" && <ProductPage productId={productId} go={go} wishlist={wishlist} toggleWish={toggleWish} addToCart={addToCart} onBuyNow={buyNowDirect} products={products}/>}
{page === "wishlist" && (
  <WishlistPage 
    wishlist={wishlist} 
    toggleWish={toggleWish} 
    quickAdd={quickAdd} 
    onBuyNow={buyNowDirect}
    go={go} 
    products={products}
  />
)}

      {page === "orders" && (
        <OrdersPage 
          orders={orders} 
          user={user}
          go={go}
        />
      )}

            {page === "cart" && (
              <CartPage
                cart={cart}
                go={go}
                updateQty={updateQty}
                removeItem={removeItem}
                coupons={coupons}
                appliedCoupon={appliedCoupon}
                setAppliedCoupon={setAppliedCoupon}
              />
            )}

            {page === "checkout" && (
              <CheckoutPage
                cart={cart}
                go={go}
                placeOrder={placeOrder}
                appliedCoupon={appliedCoupon}
              />
            )}

      {page==="about" && (
        <div className="wrap" style={{padding:"80px 0",maxWidth:760}}>
          <span className="pill-badge">من نحن</span>
          <h1 style={{fontSize:36,margin:"18px 0"}}>{headingText("سوق إلكتروني يبدأ بحركة واحدة: النقرة.")}</h1>
          <p style={{color:"var(--ink-soft)",lineHeight:1.7,fontSize:16}}>بدأ أوبن مارت بفكرة بسيطة: يجب أن يكون التسوق عبر الإنترنت سهلاً كالنقرة التي بدأته. نتعاون مع استوديوهات مستقلة وعلامات تجارية مختارة لنقدم لك منتجات متينة، بأسعار عادلة، وتوصيل سريع. هذا نموذج تجريبي للواجهة، ولا تتم معالجة الحسابات أو المدفوعات.</p>
          <button className="btn btn-primary btn-lg" style={{marginTop:20}} onClick={()=>go("shop")}>ابدأ التسوق</button>
        </div>
      )}

      <Footer go={go}/>

      <div className={"toast"+(toast?" show":"")}>
        <span className="dot"><CheckIcon size={13} style={{color:"#fff"}}/></span>{toast}
      </div>

      {showLogoutConfirm && (
        <div className="logout-modal-backdrop" onClick={() => setShowLogoutConfirm(false)}>
          <div className="logout-modal" role="dialog" aria-modal="true" aria-labelledby="logout-title" onClick={e => e.stopPropagation()}>
            <h2 id="logout-title">{headingText("هل أنت متأكد من تسجيل الخروج؟", "Are you sure you want to log out?")}</h2>
            <p>ستحتاج إلى تسجيل الدخول مرة أخرى للوصول إلى حسابك.</p>
            <div className="logout-modal-actions">
              <button className="btn btn-outline" onClick={() => setShowLogoutConfirm(false)}>إلغاء</button>
              <button className="btn btn-primary" onClick={() => { setShowLogoutConfirm(false); logout(); }}>تسجيل الخروج</button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
